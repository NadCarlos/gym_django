name: CI/CD

on:
  push:
    branches:
      - develop
      - production
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4.13@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
        env:
          MYSQL_DATABASE: gym_db
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
      MYSQL_DATABASE: gym_db
      MYSQL_USER: root
      MYSQL_PASSWORD: root_password
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      SENTRY_DSN: ""
      SENTRY_TRACES_SAMPLE_RATE: "0"
      SENTRY_PROFILES_SAMPLE_RATE: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.15"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential default-libmysqlclient-dev pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install pip==26.2.2
          pip install --require-hashes -r requirements.txt
          pip check

      - name: Audit locked production dependencies
        run: pip-audit --disable-pip --no-deps -r requirements-prod.txt

      - name: Run Django checks
        run: python gym/manage.py check

      - name: Run Django tests
        run: python gym/manage.py test administracion rehabilitacion finanzas entrada usuarios home --noinput

      - name: Validate migrations and static collection
        run: |
          python gym/manage.py makemigrations --check --dry-run
          python gym/manage.py migrate --noinput
          python gym/manage.py migrate --check
          python gym/manage.py collectstatic --dry-run --noinput
          python gym/manage.py check --deploy

      - name: Build production image
        run: docker build -t cermed-ci:runtime -f Dockerfile.prod .

      - name: Scan runtime, proxy and database images
        run: |
          docker build -t cermed-ci:nginx -f Dockerfile.nginx .
          docker build -t cermed-ci:mysql -f Dockerfile.mysql .
          bash scripts/scan-upgrade-images.sh /tmp/cermed-image-scans \
            cermed-ci:runtime cermed-ci:nginx cermed-ci:mysql

      - name: Preserve vulnerability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-vulnerability-reports
          path: /tmp/cermed-image-scans/*.json
          if-no-files-found: ignore

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Enable only after the maintenance-window migration and validation.
    if: github.ref == 'refs/heads/production' && vars.CERMED_MYSQL84_READY == 'true'
    timeout-minutes: 30
    needs: ci
    environment: production

    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_APP_DIR: ${{ secrets.PROD_APP_DIR }}
      PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      PROD_HEALTHCHECK_URL: ${{ secrets.PROD_HEALTHCHECK_URL || 'http://localhost:8000/' }}

    steps:
      - name: Validate required secrets
        run: |
          test -n "$PROD_HOST"
          test -n "$PROD_USER"
          test -n "$PROD_SSH_KEY"
          test -n "$PROD_APP_DIR"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/prod_deploy_key
          chmod 600 ~/.ssh/prod_deploy_key
          ssh-keyscan -p "$PROD_SSH_PORT" "$PROD_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on production server
        run: |
          ssh -i ~/.ssh/prod_deploy_key -p "$PROD_SSH_PORT" "$PROD_USER@$PROD_HOST" \
            "PROD_APP_DIR='$PROD_APP_DIR' PROD_HEALTHCHECK_URL='$PROD_HEALTHCHECK_URL' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          cd "$PROD_APP_DIR"

          git fetch origin production
          if git rev-parse --verify production >/dev/null 2>&1; then
            git checkout production
          else
            git checkout -b production origin/production
          fi
          git pull --ff-only origin production

          make prod-config
          make prod-deploy
          make prod-status

          docker compose --env-file .env.prod -f docker-compose-prod.yaml exec -T web \
            python gym/manage.py check --deploy

          for attempt in $(seq 1 12); do
            if curl -fsS "$PROD_HEALTHCHECK_URL" >/dev/null; then
              exit 0
            fi
            sleep 5
          done

          curl -fsS "$PROD_HEALTHCHECK_URL" >/dev/null
          REMOTE_SCRIPT
