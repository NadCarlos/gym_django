server {
    listen 80;
    listen [::]:80;
    server_name cermed.com.ar;

    # Permitir renovacion de certificados Let's Encrypt (debe ir ANTES del redirect)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirigir todas las solicitudes HTTP a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cermed.com.ar;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 2500k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/xml image/svg+xml;

    ssl_certificate /etc/letsencrypt/live/cermed.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cermed.com.ar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Servir la aplicación Django desde root
    location / {
        proxy_pass http://cermed_web:8000;
        proxy_http_version 1.1;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Archivos estáticos de Django
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Archivos media de Django
    location /media/ {
        alias /app/media/;
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
}
