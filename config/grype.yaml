# Only the proxy's perl-base lacks these modules; web includes them.
  - vulnerability: CVE-2026-82560
    namespace: debian:distro:debian:13
    reason: "Pod::Text is absent from proxy perl-base; verified module import fails."
    package:
      name: "^perl-base$"
      version: "5.40.1-6+deb13u1"
      type: deb
  - vulnerability: CVE-2026-9538
    namespace: debian:distro:debian:13
    reason: "Archive::Tar is absent from proxy perl-base; verified module import fails."
    package:
      name: "^perl-base$"
      version: "5.40.1-6+deb13u1"
      type: deb
# Applicability decisions, not patched libraries. Reevaluate on changes to
# database engines, database uploads, TLS termination, Certbot plugins or hooks.
  - vulnerability: CVE-2025-7458
    namespace: debian:distro:debian:12
    reason: "Production uses MySQL; no arbitrary SQLite SQL execution. SQLite remains vulnerable if that usage changes."
    package:
      name: "^libsqlite3-0$"
      version: "3.40.1-2+deb12u2"
      type: deb
  - vulnerability: CVE-2026-11822
    namespace: debian:distro:debian:12
    reason: "No external SQLite database ingestion or FTS5 MATCH in production; MySQL backend only."
    package:
      name: "^libsqlite3-0$"
      version: "3.40.1-2+deb12u2"
      type: deb
  - vulnerability: CVE-2026-11824
    namespace: debian:distro:debian:12
    reason: "No external SQLite database ingestion or FTS5 MATCH in production; MySQL backend only."
    package:
      name: "^libsqlite3-0$"
      version: "3.40.1-2+deb12u2"
      type: deb
  - vulnerability: CVE-2026-19445
    namespace: debian:distro:debian:13
    reason: "TLS terminates in Nginx, not a Python SNI callback server; Certbot uses webroot and no custom hooks. Reevaluate if changed."
    package:
      name: "^(libpython3[.]13-minimal|libpython3[.]13-stdlib|python3[.]13-minimal|python3[.]13)$"
      version: "3.13.5-2+deb13u5"
      type: deb
