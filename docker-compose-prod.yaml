services:
  db:
    image: mysql:5.7
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=30
      - --table-open-cache=400
      - --performance-schema=OFF
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
    env_file:
      - .env.prod
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3308:${MYSQL_PORT}" #host:container
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - db_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d/
    container_name: cermed_db
    hostname: ${MYSQL_HOST}

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy   
    env_file:
      - .env.prod
    command: sh /app/config/entrypoint.prod.sh
    volumes:
      - .:/app
      - ./backup_data:/app/gym/backup_data
      - /logs/:/app/gym/logs
    container_name: cermed_web

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command: sh /app/config/entrypoint.nginx.sh
    volumes:
      - ./gym/staticfiles:/app/staticfiles
      - ./gym/media:/app/media
      - ./cermed.conf:/etc/nginx/conf.d/cermed.conf
      - ./config:/app/config
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    depends_on:
      - web
    container_name: cermed_nginx

volumes:
  db_data:
  backup_data:
  logs:
