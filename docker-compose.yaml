services:
  db:
    image: cermed-mysql:8.4.13
    build:
      context: .
      dockerfile: Dockerfile.mysql
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=30
      - --table-open-cache=400
      - --performance-schema=OFF
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --ssl-ca=/run/mysql-tls/server/ca.pem
      - --ssl-cert=/run/mysql-tls/server/server-cert.pem
      - --ssl-key=/run/mysql-tls/server/server-key.pem
      - --require-secure-transport=ON
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3308:${MYSQL_PORT}" #host:container
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - db_data84:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d/
      - type: bind
        source: ${CERMED_MYSQL_TLS_DIR:?Generate private MySQL TLS files outside the repo}/server
        target: /run/mysql-tls/server
        read_only: true
        bind:
          create_host_path: false
    container_name: gym_db
    hostname: ${MYSQL_HOST}

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy   
    env_file:
      - .env
    environment:
      MYSQL_SSL_CA: /run/mysql-tls/client/ca.pem
    command: sh /app/config/entrypoint.dev.sh
    volumes:
      - .:/app
      - ./backup_data:/app/gym/backup_data
      - /logs/:/app/gym/logs
      - type: bind
        source: ${CERMED_MYSQL_TLS_DIR:?Generate private MySQL TLS files outside the repo}/client
        target: /run/mysql-tls/client
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CERMED_MYSQL_TLS_DIR:?Generate private MySQL TLS files outside the repo}/client/client.cnf
        target: /etc/mysql/conf.d/cermed-tls.cnf
        read_only: true
        bind:
          create_host_path: false
    container_name: gym_web

volumes:
  # A fresh volume protects existing MySQL 5.7 data from an in-place upgrade.
  db_data84:
  backup_data:
  logs:
